<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMap 3D + Three.js Red Cube</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #container {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<div id="container"></div>

<!-- AMap security config must be set before loading the AMap SDK -->
<script>
  window._AMapSecurityConfig = {
    securityJsCode: '__AMAP_CODE__'
  };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_KEY__"></script>

<!-- Three.js r186 via importmap -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// The Bund, Shanghai - WGS-84 GPS coordinates from a phone
const BUND_WGS84 = [121.4998, 31.2397]; // [lng, lat]

// Desired constant on-screen width of the cube, in CSS pixels
const TARGET_PIXEL_SIZE = 40;

function boot() {
  const map = new AMap.Map('container', {
    viewMode: '3D',
    zoom: 13,
    center: [121.4737, 31.2304], // Shanghai city center
    pitch: 45,
    rotation: 0,
    mapStyle: 'amap://styles/normal'
  });

  // Expose the map instance for test scripts
  window.map = map;

  // Convert the phone's WGS-84 GPS coordinate to AMap's (GCJ-02) coordinate
  // system before placing anything on the map.
  AMap.convertFrom([BUND_WGS84], 'gps', function (status, result) {
    if (status !== 'complete' || result.info !== 'ok' || !result.locations || !result.locations.length) {
      console.error('AMap.convertFrom failed', status, result);
      return;
    }

    const converted = result.locations[0];
    const bundLngLat = [converted.getLng(), converted.getLat()];

    initGLLayer(map, bundLngLat);
  });
}

function initGLLayer(map, bundLngLat) {
  AMap.plugin(['AMap.GLCustomLayer'], function () {
    let renderer, camera, scene, cube, customCoords;

    const gllayer = new AMap.GLCustomLayer({
      zIndex: 120,
      init: (gl) => {
        renderer = new THREE.WebGLRenderer({
          context: gl,
          antialias: true
        });
        renderer.autoClear = false;

        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          100,
          1 << 30
        );

        scene = new THREE.Scene();

        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
      },
      render: () => {
        renderer.resetState();

        customCoords = gllayer.customCoords;
        customCoords.setCenter(bundLngLat);

        const [x, y, z] = customCoords.lngLatsToCoords([bundLngLat])[0];

        // Keep the cube's on-screen width pinned to ~40px regardless of
        // the map's current zoom level, by converting the target pixel
        // size into real-world meters at the cube's location, and
        // scaling the unit cube geometry accordingly.
        const resolution = map.getResolution(bundLngLat); // meters / pixel
        const sizeInMeters = TARGET_PIXEL_SIZE * resolution;
        cube.scale.set(sizeInMeters, sizeInMeters, sizeInMeters);

        // Sit the cube on top of the ground plane instead of half-buried.
        cube.position.set(x, y, (z || 0) + sizeInMeters / 2);

        camera.aspect = window.innerWidth / window.innerHeight;

        const { near, far, fov, up, lookAt, position } = customCoords.getCameraParams();
        camera.near = near;
        camera.far = far;
        camera.fov = fov;
        camera.position.set(position[0], position[1], position[2]);
        camera.up.set(up[0], up[1], up[2]);
        camera.lookAt(lookAt[0], lookAt[1], lookAt[2]);
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
      }
    });

    gllayer.setMap(map);

    window.addEventListener('resize', () => {
      map.render && map.render();
    });
  });
}

window.addEventListener('load', boot);
</script>
</body>
</html>
